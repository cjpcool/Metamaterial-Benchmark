data_name: 'LatticeModulus'
data_path: '/home/jianpengc/datasets/metamaterial/LatticeModulus' #'D:\项目\Material design\code_data\data\LatticeModulus'
data_seed: 42
train_size: 8000 # 0.7 11696.3
valid_size: 2000

wandb_args:
  use_wandb: true
  entity: "jianpengc"
  project: "metabench"
  save_name: 'mave+ve-young-2'

network:
  lmax: 4
  hidden_irreps: '32x0e+32x1o+32x2e+32x3o+32x4e'
  readout_irreps: '16x0e+16x1o+16x2e+16x3o+16x4e'
  num_edge_bases: 6
  interaction_reduction: sum
  interaction_bias: true
  agg_norm_const: 4.0
  inter_MLP_dim: 64
  inter_MLP_layers: 3
  correlation: 3
  global_reduction: mean
  message_passes: 2
  positive_function: matrix_power_2
  node_ft_dim: 4

  output_dim: 3

training:
  pred_property: 'young' # young, shear, poisson, all

  rotate: false
  batch_size: 32
  valid_batch_size: 32
  log_every_n_steps: 25
  optimizer: adamw
  lr: 1.0e-4
  amsgrad: true
  weight_decay: 0.
  beta1: 0.9
  epsilon: 1.0e-8
  num_workers: 4

  use_cuda: true
  log_dir: './logs/mace_ve/young'
  save_dir: './checkpoints/mace_ve/young_2'
  accumulate_grad_batches: 8  # effective batch size 256
  gradient_clip_val: 10.0
  max_steps: 50000
  val_check_interval: 100